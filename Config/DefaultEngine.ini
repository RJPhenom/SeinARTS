[CoreRedirects]
; Squad system split out of SeinARTSCoreEntity into SeinARTSSquad extension
; (2026-06-02). Component DATA definitions stayed in CoreEntity; only the
; system, resolver, BPFLs, and ability moved. These redirects let existing
; BP content load without re-saves.
+ClassRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSquadDispatchResolver",NewName="/Script/SeinARTSSquad.SeinSquadDispatchResolver")
+ClassRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSquadBPFL",NewName="/Script/SeinARTSSquad.SeinSquadBPFL")
+ClassRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinAbility_SquadReinforce",NewName="/Script/SeinARTSSquad.SeinAbility_SquadReinforce")
; Squad mutation functions moved from USeinSimMutationBPFL → USeinSquadMutationBPFL.
+FunctionRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSimMutationBPFL.SeinSetSquadData",NewName="/Script/SeinARTSSquad.SeinSquadMutationBPFL.SeinSetSquadData")
+FunctionRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSimMutationBPFL.SeinSetSquadMemberData",NewName="/Script/SeinARTSSquad.SeinSquadMutationBPFL.SeinSetSquadMemberData")
+FunctionRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSimMutationBPFL.SeinSetSquadLeader",NewName="/Script/SeinARTSSquad.SeinSquadMutationBPFL.SeinSetSquadLeader")
+FunctionRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSimMutationBPFL.SeinAddSquadMember",NewName="/Script/SeinARTSSquad.SeinSquadMutationBPFL.SeinAddSquadMember")
+FunctionRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSimMutationBPFL.SeinRemoveSquadMember",NewName="/Script/SeinARTSSquad.SeinSquadMutationBPFL.SeinRemoveSquadMember")
+FunctionRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSimMutationBPFL.SeinFillSquadSlot",NewName="/Script/SeinARTSSquad.SeinSquadMutationBPFL.SeinFillSquadSlot")
+FunctionRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSimMutationBPFL.SeinEmptySquadSlot",NewName="/Script/SeinARTSSquad.SeinSquadMutationBPFL.SeinEmptySquadSlot")
+FunctionRedirects=(OldName="/Script/SeinARTSCoreEntity.SeinSimMutationBPFL.SeinSetSlotOffsetTransform",NewName="/Script/SeinARTSSquad.SeinSquadMutationBPFL.SeinSetSlotOffsetTransform")
; Cover modules moved from SeinARTSFramework plugin to SeinARTSCoverExtension.
; CoverAwareSquadDispatchResolver moved from SeinARTSCover to SeinARTSCoverSquad bridge module.
+ClassRedirects=(OldName="/Script/SeinARTSCover.SeinCoverAwareSquadDispatchResolver",NewName="/Script/SeinARTSCoverSquad.SeinCoverAwareSquadDispatchResolver")
; FormationPreviewSubsystem moved from SeinARTSCover to SeinARTSCoverSquad bridge module.
+ClassRedirects=(OldName="/Script/SeinARTSCover.SeinFormationPreviewSubsystem",NewName="/Script/SeinARTSCoverSquad.SeinFormationPreviewSubsystem")
; Movement modes (Infantry/Wheeled/Tracked/Hover/Flight) + their per-class data
; structs moved from SeinARTSMovement (framework) to the SeinARTSMovementPlus
; extension (2026-06-02). These are ALSO declared in that extension's own
; Config/DefaultEngine.ini, but CoreRedirects living only in a plugin config were
; NOT being applied to already-saved FInstancedStruct MovementClassData payloads —
; they reset to empty at load (LogCore "Unable to find serialized UScriptStruct").
; Declaring them here in the PROJECT config, matching the Squad/Cover/Combat splits
; above, makes them resolve reliably. (StructRedirects are the load-bearing ones for
; the MovementClassData payload; ClassRedirects cover the MovementClass soft path.)
+ClassRedirects=(OldName="/Script/SeinARTSMovement.SeinInfantryMovement",NewName="/Script/SeinARTSMovementPlus.SeinInfantryMovement")
+ClassRedirects=(OldName="/Script/SeinARTSMovement.SeinWheeledVehicleMovement",NewName="/Script/SeinARTSMovementPlus.SeinWheeledVehicleMovement")
+ClassRedirects=(OldName="/Script/SeinARTSMovement.SeinTrackedVehicleMovement",NewName="/Script/SeinARTSMovementPlus.SeinTrackedVehicleMovement")
+ClassRedirects=(OldName="/Script/SeinARTSMovement.SeinHoverMovement",NewName="/Script/SeinARTSMovementPlus.SeinHoverMovement")
+ClassRedirects=(OldName="/Script/SeinARTSMovement.SeinFlightMovement",NewName="/Script/SeinARTSMovementPlus.SeinFlightMovement")
+StructRedirects=(OldName="/Script/SeinARTSMovement.SeinInfantryMovementData",NewName="/Script/SeinARTSMovementPlus.SeinInfantryMovementData")
+StructRedirects=(OldName="/Script/SeinARTSMovement.SeinWheeledMovementData",NewName="/Script/SeinARTSMovementPlus.SeinWheeledMovementData")
+StructRedirects=(OldName="/Script/SeinARTSMovement.SeinTrackedMovementData",NewName="/Script/SeinARTSMovementPlus.SeinTrackedMovementData")
+StructRedirects=(OldName="/Script/SeinARTSMovement.SeinHoverMovementData",NewName="/Script/SeinARTSMovementPlus.SeinHoverMovementData")
+StructRedirects=(OldName="/Script/SeinARTSMovement.SeinFlyingMovementData",NewName="/Script/SeinARTSMovementPlus.SeinFlyingMovementData")
